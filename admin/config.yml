# Decap CMS config — https://decapcms.org/docs/configuration-options/
#
# TODO once the repo exists: replace REPO_OWNER/REPO_NAME below, and enable
# GitHub login for this repo in Netlify (Site settings → Identity is NOT
# needed for this — Decap's git-gateway isn't used here; instead we use the
# plain "github" backend below, which needs Netlify's OAuth provider enabled
# under Site settings → Access control → OAuth, or a self-hosted
# decap-proxy). See README.md for the exact steps.

backend:
  name: github
  repo: appukurian/tinkertalks
  branch: main
  # Editorial workflow: saving an entry opens a PR instead of committing
  # straight to main. This is what turns "claim + document a TinkerTalk"
  # into a pull request Kurian reviews and merges.
 
  # 70+ campus chapters need to be able to submit without each one being
  # added as a GitHub collaborator on this repo. open_authoring makes Decap
  # fork the repo on the volunteer's behalf and PR from their fork instead —
  # this only works because the repo is public.
  open_authoring: true


  
publish_mode: editorial_workflow
media_folder: "admin/uploads"
public_folder: "/admin/uploads"

# Chapters should only ever edit a TinkerTalk that the daily Metabase sync
# already created — not invent new ones from thin air — so entry creation
# is turned off. New files only ever come from scripts/fetch_metabase.py.
collections:
  - name: "talks"
    label: "TinkerTalks"
    folder: "data/talks"
    extension: "json"
    format: "json"
    create: false
    delete: false
    identifier_field: id
    summary: "{{chapter}} ({{date}}) — {{status}}"
    # Chapter, date, location, speaker, participant counts, and photos all
    # already exist elsewhere in TinkerHub's data — the event record itself,
    # plus the event report every chapter already files after a session
    # (linked by event id; see the TODO in scripts/fetch_metabase.py once
    # that table is wired in). Asking a volunteer to retype any of that here
    # would just be duplicate data entry with a chance to go stale. The ONE
    # thing that genuinely doesn't exist anywhere else is what was actually
    # discussed — so that's the only field a claimant sees.
    fields:
      - { name: "id", label: "ID", widget: "hidden" }
      - { name: "resource_id", label: "Resource ID", widget: "hidden" }
      - { name: "metabase_row_id", label: "Metabase row id", widget: "hidden" }
      - { name: "synced_at", label: "Last synced", widget: "hidden" }
      - { name: "chapter", label: "Chapter / Campus", widget: "hidden" }
      - { name: "date", label: "Date", widget: "hidden" }
      - { name: "status", label: "Status", widget: "hidden" }
      - { name: "claimed_by", label: "Claimed by", widget: "hidden" }
      - { name: "claimed_at", label: "Claimed at", widget: "hidden" }
      - { name: "topic", label: "Topic", widget: "hidden" }
      - { name: "speaker", label: "Speaker / facilitator", widget: "hidden" }
      - { name: "location", label: "Location", widget: "hidden" }
      - { name: "photos", label: "Photos", widget: "hidden" }
      - name: "discussion_notes"
        label: "What exactly did you discuss in this TinkerTalk?"
        widget: "text"
        required: true
